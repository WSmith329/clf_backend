<div class="grid grid-cols-4 justify-items-center items-center gap-y-3">
    <div class="font-bold text-primary underline">
        Set
    </div>
    <div class="font-bold text-primary underline">
        Aim
    </div>
    <div class="font-bold text-primary underline">
        Completed
    </div>
    <div class="font-bold text-primary underline">
        Weight
    </div>
    {% for set in session_exercise.set_recordings %}
        <div class="font-bold text-sm">
            <p>{{ set.order }}</p>
        </div>
        <div class="text-sm">
            {% if set.aim %}
                <p>{{ set.aim }}</p>
            {% else %}
                <p>Until Failure</p>
            {% endif %}
        </div>
        <div class="text-sm">
            <p>{{ set.completed }}</p>
        </div>
        <div class="text-sm">
            <p>{{ set.weight }}</p>
        </div>
    {% endfor %}
</div>
